# Performance and bundle budget: fails if the JavaScript the site ships is over budget (see scripts/check-size.mjs).
# Switch it on: copy this file into .github/workflows/ and push.
name: Bundle budget

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
