# Secret scanning: fails if an API key, token or password is committed, using gitleaks.
# Switch it on: copy this file into .github/workflows/ and push.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Scans the files as they are now. Add --log-opts to scan the git history too.
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          dir /repo --redact --verbose
