# Dependency vulnerability scan: fails on a known high or critical vulnerability in a package the site ships.
# Switch it on: copy this file into .github/workflows/ and push.
name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit
