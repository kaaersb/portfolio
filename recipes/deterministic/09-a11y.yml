# Accessibility check: builds the site and runs axe-core on it in a real browser (tests/a11y).
# Switch it on: copy this file into .github/workflows/ and push.
name: Accessibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run a11y
