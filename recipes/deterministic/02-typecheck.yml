# Type check: Vite builds without checking types, so a wrong type can ship. This catches it.
# Switch it on: copy this file into .github/workflows/ and push.
name: Type check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
