# AI code review with Claude: Claude Code reads the pull request and leaves review comments on the lines it means.
# Switch it on: copy this file into .github/workflows/ and push, then open a pull request.
# Needs an Anthropic API key (console.anthropic.com) saved in GitHub as ANTHROPIC_API_KEY
# (Repo > Settings > Secrets and variables > Actions). This one costs a little per run.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to a small student website (Vite + TypeScript).
            Look for bugs, unclear code and anything risky to deploy. Be brief and specific.
            Comment on the lines you mean, and end with a short summary comment on the pull request.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
