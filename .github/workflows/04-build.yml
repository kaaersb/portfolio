# Production build must pass: the same build Vercel runs, so a broken build never reaches main.
# Switch it on: copy this file into .github/workflows/ and push.
name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
